name: Update data

on:
  schedule:
    # every day at 09:17 UTC (06:17 in Brasília)
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Restore raw downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Install
        working-directory: pipeline
        run: pip install -e ".[dev]"
      - name: Tests
        working-directory: pipeline
        run: pytest -q
      - name: Run pipeline
        working-directory: pipeline
        run: python -m gastometro run | tee ../pipeline-summary.json
      - name: Upload summary and database
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            pipeline-summary.json
            data/gastometro.duckdb
          retention-days: 7
      - name: Commit updated aggregates
        id: commit
        run: |
          git config user.name "gastometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/data
          # meta.json carries the run timestamp; ignore runs where only it changed
          if [ -z "$(git diff --cached --name-only | grep -v 'site/public/data/meta.json')" ]; then
            git reset -q
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudanças nos dados."
          else
            git commit -m "data: atualização automática $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
